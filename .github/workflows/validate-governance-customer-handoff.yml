name: Validate Governance Customer Handoff

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate-public-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate public package
        run: python scripts/validate_public_package.py
